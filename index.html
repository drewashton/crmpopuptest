<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Newsletter Popup Preview</title>

  <style>
  body {
    margin: 0;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
  }

  .newsletter-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

  .newsletter-popup {
    background: #F2BE4C;
    max-width: 560px;
    width: 92%;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    position: relative;
    box-shadow: 0 25px 70px rgba(0,0,0,0.35);
  }

  .newsletter-close {
    position: absolute;
    top: 18px;
    right: 18px;
    font-size: 20px;
    cursor: pointer;
  }

  h2 {
    font-size: 32px;
    margin-bottom: 10px;
  }

  p {
    margin-bottom: 28px;
  }

  input {
    width: 100%;
    padding: 14px;
    margin-bottom: 14px;
    border: none;
    border-radius: 6px;
    box-sizing: border-box;
  }

  button {
    padding: 14px 32px;
    background: #000;
    color: #F2BE4C;
    font-weight: 800;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  </style>
</head>

<body>

<div class="newsletter-overlay" id="newsletterPopup">
  <div class="newsletter-popup">
    <div class="newsletter-close" onclick="closeNewsletter()">✕</div>

    <h2>Newsletter</h2>
    <p>Subscribe to our newsletter and stay updated.</p>

    <form>
      <input placeholder="First Name">
      <input placeholder="Last Name">
      <input placeholder="Email">
      <button>SUBSCRIBE</button>
    </form>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  setTimeout(function () {
    const popup = document.getElementById("newsletterPopup");
    popup.style.display = "flex";
  }, 500);
});

function closeNewsletter() {
  document.getElementById("newsletterPopup").style.display = "none";
}
</script>

</body>
</html>
