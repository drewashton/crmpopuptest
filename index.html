<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Newsletter Popup</title>

<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: white;
  }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #popup {
    background: #F2BE4C;
    padding: 40px;
    width: 420px;
    max-width: 90%;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    text-align: center;
  }

  h2 {
    margin-top: 0;
    font-size: 28px;
    font-weight: 800;
  }

  p {
    margin-bottom: 24px;
  }

  input {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
  }

  button {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    font-weight: 700;
    background: black;
    color: #F2BE4C;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  button:hover {
    opacity: 0.9;
  }

  #thanks {
    display: none;
    font-weight: 600;
    margin-top: 20px;
  }
</style>
</head>

<body>

<div id="overlay">
  <div id="popup">
    <h2>Join our newsletter</h2>
    <p>Get updates straight to your inbox.</p>

    <input id="firstname" placeholder="First name">
    <input id="lastname" placeholder="Last name">
    <input id="email" placeholder="Email address">

    <button id="subscribeBtn">Subscribe</button>

    <p id="thanks">Thanks for subscribing 🎉</p>
  </div>
</div>

<script>
  const BREVO_FORM_URL =
    "https://a6d48789.sibforms.com/serve/MUIFAHA4a2bQgaDI2t2lG9Y5tvpSvvS9XLERjKR-IcBJZrR-8yuWNKN_Y5HBhJGhYze57PzdNb1XGW-1LW1iu_0MPq5UWiYzNmgi2feAkqF6VonwtH6M6qtExpa53u9c92lQJ5GMB0L81suX-11MO930HXfPapDQXgGfrBRdBWhzoLHh06aqe09KemRHKPuzTr7wFSFALUHIzViF9A==";

  document.getElementById("subscribeBtn").addEventListener("click", () => {
    const email = document.getElementById("email").value;
    if (!email) return;

    const formData = new FormData();
    formData.append("EMAIL", email);
    formData.append("FIRSTNAME", document.getElementById("firstname").value);
    formData.append("LASTNAME", document.getElementById("lastname").value);
    formData.append("locale", "en");
    formData.append("html_type", "simple");

    fetch(BREVO_FORM_URL, {
      method: "POST",
      body: formData,
      mode: "no-cors"
    });

    document.getElementById("thanks").style.display = "block";
    document.getElementById("subscribeBtn").disabled = true;
    document.getElementById("subscribeBtn").innerText = "Subscribed";
  });
</script>

</body>
</html>
