<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Newsletter Popup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --yellow: #FBB414;
    --black: #000000;
    --overlay: rgba(0,0,0,0.6);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      Inter, Helvetica, Arial, sans-serif;
  }


  #overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.35s ease-out;
  }


  #popup {
    position: relative;
    background: var(--yellow);
    width: 620px;
    max-width: 92%;
    padding: 56px;
    border-radius: 28px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.3);
    text-align: center;
    animation: popIn 0.45s cubic-bezier(.2,.8,.2,1);
  }


  #closePopup {
    position: absolute;
    top: 22px;
    right: 22px;
    background: none;
    border: none;
    font-size: 34px;
    font-weight: 700;
    line-height: 1;
    color: #000;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.2s ease, transform 0.15s ease;
  }

  #closePopup:hover {
    opacity: 1;
    transform: scale(1.1);
  }

  h2 {
    margin: 0 0 12px;
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  p {
    margin: 0 0 36px;
    font-size: 18px;
    line-height: 1.6;
  }


  input {
    width: 100%;
    padding: 18px 20px;
    margin-bottom: 16px;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    outline: none;
    background: rgba(255,255,255,0.95);
    transition: box-shadow 0.2s ease, transform 0.15s ease;
  }

  input:focus {
    box-shadow: 0 0 0 3px rgba(0,0,0,0.15);
    transform: translateY(-1px);
  }


  button#subscribeBtn {
    width: 100%;
    padding: 18px;
    margin-top: 10px;
    font-size: 18px;
    font-weight: 700;
    background: var(--black);
    color: var(--yellow);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }

  button#subscribeBtn:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }

  button#subscribeBtn:disabled {
    opacity: 0.6;
    cursor: default;
    box-shadow: none;
    transform: none;
  }


  #thanks {
    display: none;
    margin-top: 24px;
    font-size: 18px;
    font-weight: 600;
  }


  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes popIn {
    from {
      opacity: 0;
      transform: scale(0.92) translateY(20px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }
</style>
</head>

<body>

<div id="overlay">
  <div id="popup">
    <button id="closePopup" aria-label="Close popup">&times;</button>

    <h2>Join Our Newsletter</h2>
    <p>Get updates on the team.</p>

    <input id="firstname" type="text" placeholder="First name">
    <input id="lastname" type="text" placeholder="Last name">
    <input id="email" type="email" placeholder="Email address" required>

    <button id="subscribeBtn">Subscribe</button>

    <div id="thanks">Thank you for subscribing.</div>
  </div>
</div>

<script>
  const BREVO_FORM_URL =
    "https://a6d48789.sibforms.com/serve/MUIFAHA4a2bQgaDI2t2lG9Y5tvpSvvS9XLERjKR-IcBJZrR-8yuWNKN_Y5HBhJGhYze57PzdNb1XGW-1LW1iu_0MPq5UWiYzNmgi2feAkqF6VonwtH6M6qtExpa53u9c92lQJ5GMB0L81suX-11MO930HXfPapDQXgGfrBRdBWhzoLHh06aqe09KemRHKPuzTr7wFSFALUHIzViF9A==";

  document.getElementById("subscribeBtn").addEventListener("click", () => {
    const email = document.getElementById("email").value;
    if (!email) return;

    const formData = new FormData();
    formData.append("EMAIL", email);
    formData.append("FIRSTNAME", document.getElementById("firstname").value);
    formData.append("LASTNAME", document.getElementById("lastname").value);
    formData.append("locale", "en");
    formData.append("html_type", "simple");

    fetch(BREVO_FORM_URL, {
      method: "POST",
      body: formData,
      mode: "no-cors"
    });

    document.getElementById("thanks").style.display = "block";
    document.getElementById("subscribeBtn").innerText = "Subscribed";
    document.getElementById("subscribeBtn").disabled = true;
  });

  document.getElementById("closePopup").addEventListener("click", () => {
    document.getElementById("overlay").style.display = "none";
  });

  document.getElementById("overlay").addEventListener("click", (e) => {
    if (e.target.id === "overlay") {
      e.currentTarget.style.display = "none";
    }
  });
</script>

</body>
</html>
